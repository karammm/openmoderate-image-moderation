name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" pytest-github-actions-annotate-failures
      - name: Check the model stack imports (catches torch/torchvision mismatches)
        run: python -c "import open_clip, torchvision; print(open_clip.__version__, torchvision.__version__)"
      - run: ruff check src tests scripts examples benchmark
      - run: ruff format --check src tests scripts examples benchmark
      - name: Type check
        run: |
          pip install "mypy>=1.10" types-PyYAML
          mypy src/openmoderate --ignore-missing-imports
      - run: pytest -q
      - run: python -m build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: |
          set -o pipefail
          if ! docker build --progress=plain -t openmoderate:ci . 2>&1 | tee build.log; then
            msg=$(tail -c 4000 build.log | python3 -c "import sys; print(sys.stdin.read().replace('%','%25').replace('\\r','').replace('\\n','%0A'))")
            echo "::error title=docker build failed::$msg"
            exit 1
          fi
      - name: Smoke test the container
        run: |
          docker run -d --name om -p 8000:8000 -e OPENMODERATE_API_KEY=ci-key openmoderate:ci
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health | grep '"model_loaded":true'
          python3 -c "import zlib,struct; raw=b''.join(b'\x00'+b'\x40\x90\xd0'*64 for _ in range(64)); c=lambda t,d: struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)); open('blue.png','wb').write(b'\x89PNG\r\n\x1a\n'+c(b'IHDR',struct.pack('>IIBBBBB',64,64,8,2,0,0,0))+c(b'IDAT',zlib.compress(raw))+c(b'IEND',b''))"
          test "$(curl -s -o /dev/null -w '%{http_code}' -F file=@blue.png localhost:8000/v1/moderate)" = 401
          curl -sf -H 'X-API-Key: ci-key' -F file=@blue.png localhost:8000/v1/moderate | tee out.json
          grep '"is_safe":true' out.json
          # Video support works end to end: build a 3 s clip inside the container (which has
          # OpenCV) and moderate it. Without OpenCV the endpoint would return 501.
          docker exec om python -c "import cv2, numpy as np; w = cv2.VideoWriter('/tmp/v.mp4', cv2.VideoWriter_fourcc(*'mp4v'), 10, (64, 64)); [w.write(np.full((64, 64, 3), (208, 144, 64), np.uint8)) for _ in range(30)]; w.release()"
          docker cp om:/tmp/v.mp4 v.mp4
          curl -sf -H 'X-API-Key: ci-key' -F file=@v.mp4 localhost:8000/v1/moderate/video | tee video.json
          grep '"frames_analyzed":3' video.json
          grep '"segments":\[\]' video.json
      - name: Container logs
        if: always()
        run: docker logs om || true
