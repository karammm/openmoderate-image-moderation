[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "openmoderate"
dynamic = ["version"]
description = "Open-source, self-hosted image content moderation (nudity, violence, hate, weapons, drugs...) — a pip-installable alternative to cloud moderation APIs."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "openmoderate contributors" }]
keywords = ["content-moderation", "nsfw", "computer-vision", "clip", "image-classification", "trust-and-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pillow>=9.0",
    "numpy>=1.21",
    "torch>=2.0",
    "open_clip_torch>=2.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/karammm/openmoderate-image-moderation"
Issues = "https://github.com/karammm/openmoderate-image-moderation/issues"

[tool.hatch.version]
path = "src/openmoderate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openmoderate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads and runs the real CLIP model"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
