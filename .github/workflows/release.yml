name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    # Enable by setting the repository variable PYPI_PUBLISH=true once PyPI trusted
    # publishing is configured for this repo.
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
