<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1006" viewBox="0 0 1200 1006" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">How openmoderate works</title>
<desc id="desc">openmoderate is an open-source Python library that checks uploaded images for nudity, violence, weapons, hate symbols, drugs and more. It runs a CLIP model locally, compares each image against text descriptions of every category, and returns whether the image is safe. Use it as a Python library, a command-line tool or a REST API.</desc>
<style>
  :root, svg {
    --bg: #ffffff; --surface: #f6f8fa; --border: #d0d7de; --text: #1f2328;
    --muted: #59636e; --accent: #0969da; --accent-soft: #ddf4ff; --safe: #1a7f37;
    --flag: #cf222e; --code: #1f2328; --term-bg: #0d1117; --term-text: #e6edf3;
    --term-muted: #8b949e;
  }
  @media (prefers-color-scheme: dark) {
    :root, svg {
      --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3;
      --muted: #9198a1; --accent: #4493f8; --accent-soft: #121d2f; --safe: #3fb950;
      --flag: #f85149; --code: #e6edf3; --term-bg: #010409; --term-text: #e6edf3;
      --term-muted: #8b949e;
    }
  }
  text {
    white-space: pre; fill: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .muted { fill: var(--muted); }
  .accent { fill: var(--accent); }
  .safe { fill: var(--safe); }
  .flag { fill: var(--flag); }
  .label { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; fill: var(--muted); }
  .box { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
  .arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill: var(--muted)"/></marker></defs>
<rect width="1200" height="1006" rx="16" style="fill: var(--bg)"/>
<text x="48" y="64"><tspan font-size="36" font-weight="700">openmoderate</tspan><tspan dx="16" font-size="20" class="muted">open-source image &amp; video moderation for Python</tspan></text>
<text x="48" y="98" font-size="16" class="muted" text-anchor="start">Detect nudity, violence, weapons, hate symbols, drugs and more in images and videos. Runs on your servers: no cloud account, no per-image fees.</text>
<text x="48" y="152" font-size="14" class="label" text-anchor="start">HOW IT WORKS</text>
<rect class="box" x="48.0" y="170" width="160" height="104" rx="10"/>
<text x="62.0" y="200" font-size="16" font-weight="650" text-anchor="start">1  Upload</text>
<text x="62.0" y="228" font-size="13" class="muted" text-anchor="start">file path, URL, bytes,</text>
<text x="62.0" y="247" font-size="13" class="muted" text-anchor="start">upload object or image</text>
<line class="arrow" x1="211.0" y1="222.0" x2="233.8" y2="222.0" marker-end="url(#ah)"/>
<rect class="box" x="236.8" y="170" width="160" height="104" rx="10"/>
<text x="250.8" y="200" font-size="16" font-weight="650" text-anchor="start">2  Normalize</text>
<text x="250.8" y="228" font-size="13" class="muted" text-anchor="start">fix rotation, flatten</text>
<text x="250.8" y="247" font-size="13" class="muted" text-anchor="start">alpha, cap the size</text>
<line class="arrow" x1="399.8" y1="222.0" x2="422.6" y2="222.0" marker-end="url(#ah)"/>
<rect class="box" x="425.6" y="170" width="160" height="104" rx="10"/>
<text x="439.6" y="200" font-size="16" font-weight="650" text-anchor="start">3  Embed</text>
<text x="439.6" y="228" font-size="13" class="muted" text-anchor="start">CLIP turns the image</text>
<text x="439.6" y="247" font-size="13" class="muted" text-anchor="start">into a vector, locally</text>
<line class="arrow" x1="588.6" y1="222.0" x2="611.4" y2="222.0" marker-end="url(#ah)"/>
<rect class="box" x="614.4000000000001" y="170" width="160" height="104" rx="10"/>
<text x="628.4000000000001" y="200" font-size="16" font-weight="650" text-anchor="start">4  Compare</text>
<text x="628.4000000000001" y="228" font-size="13" class="muted" text-anchor="start">against text for every</text>
<text x="628.4000000000001" y="247" font-size="13" class="muted" text-anchor="start">category + look-alikes</text>
<line class="arrow" x1="777.4000000000001" y1="222.0" x2="800.2" y2="222.0" marker-end="url(#ah)"/>
<rect class="box" x="803.2" y="170" width="160" height="104" rx="10"/>
<text x="817.2" y="200" font-size="16" font-weight="650" text-anchor="start">5  Score</text>
<text x="817.2" y="228" font-size="13" class="muted" text-anchor="start">a calibrated 0–1</text>
<text x="817.2" y="247" font-size="13" class="muted" text-anchor="start">score per category</text>
<line class="arrow" x1="966.2" y1="222.0" x2="989.0" y2="222.0" marker-end="url(#ah)"/>
<rect class="box" x="992.0" y="170" width="160" height="104" rx="10"/>
<text x="1006.0" y="200" font-size="16" font-weight="650" text-anchor="start">6  Decide</text>
<text x="1006.0" y="228" font-size="13" class="muted" text-anchor="start">your thresholds give</text>
<text x="1006.0" y="247" font-size="13" class="muted" text-anchor="start">is_safe + violations</text>
<rect x="614.4000000000001" y="308" width="348.8" height="58" rx="10" style="fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: 5 4"/>
<text x="628.4000000000001" y="332" font-size="14" font-weight="650" class="accent" text-anchor="start">Optional: a head trained on your images</text>
<text x="628.4000000000001" y="352" font-size="12.5" class="muted mono" text-anchor="start">openmoderate train ./dataset → blends in</text>
<path class="arrow" d="M505.6,277 V337.0 H611.4000000000001" marker-end="url(#ah)"/>
<line class="arrow" x1="883.2" y1="305" x2="883.2" y2="277" marker-end="url(#ah)"/>
<text x="48" y="332" font-size="13" class="muted" text-anchor="start">Categories are plain text, so you can add</text>
<text x="48" y="351" font-size="13" class="muted" text-anchor="start">your own in YAML without any training data.</text>
<text x="48" y="420" font-size="14" class="label" text-anchor="start">USE IT THREE WAYS</text>
<rect class="box" x="48.0" y="438" width="352.0" height="178" rx="10"/>
<text x="66.0" y="470" font-size="17" font-weight="650" text-anchor="start">Python library</text>
<text x="66.0" y="502" font-size="13" class="mono muted" text-anchor="start">$ pip install openmoderate</text>
<text x="66.0" y="524" font-size="13" class="mono" text-anchor="start">from openmoderate import Moderator</text>
<text x="66.0" y="546" font-size="13" class="mono" text-anchor="start">res = Moderator().analyze(&quot;up.jpg&quot;)</text>
<text x="66.0" y="568" font-size="13" class="mono" text-anchor="start">res.is_safe     # False</text>
<text x="66.0" y="590" font-size="13" class="mono" text-anchor="start">res.violations  # weapons 0.96</text>
<rect class="box" x="424.0" y="438" width="352.0" height="178" rx="10"/>
<text x="442.0" y="470" font-size="17" font-weight="650" text-anchor="start">Command line</text>
<text x="442.0" y="502" font-size="13" class="mono muted" text-anchor="start">$ openmoderate scan ./uploads</text>
<text x="442.0" y="524" font-size="13" class="mono flag" text-anchor="start">FLAGGED  pistol.jpg  weapons 100%</text>
<text x="442.0" y="546" font-size="13" class="mono safe" text-anchor="start">SAFE     dog.jpg</text>
<text x="442.0" y="568" font-size="13" class="mono muted" text-anchor="start">$ openmoderate train ./dataset</text>
<text x="442.0" y="590" font-size="13" class="mono" text-anchor="start">Saved head to head.omh</text>
<rect class="box" x="800.0" y="438" width="352.0" height="178" rx="10"/>
<text x="818.0" y="470" font-size="17" font-weight="650" text-anchor="start">REST API + Docker</text>
<text x="818.0" y="502" font-size="13" class="mono muted" text-anchor="start">$ openmoderate serve</text>
<text x="818.0" y="524" font-size="13" class="mono muted" text-anchor="start">$ curl -F file=@up.jpg \</text>
<text x="818.0" y="546" font-size="13" class="mono muted" text-anchor="start">    localhost:8000/v1/moderate</text>
<text x="818.0" y="568" font-size="13" class="mono" text-anchor="start">{&quot;is_safe&quot;: false, &quot;violations&quot;: …}</text>
<text x="818.0" y="590" font-size="13" class="mono muted" text-anchor="start">$ docker run -p 8000:8000 openmoderate</text>
<text x="48" y="646" font-size="14" class="muted">Plus drop-in upload protection for FastAPI, Flask and Django:  <tspan class="mono" style="fill: var(--text)">file: ModeratedFile</tspan></text>
<text x="48" y="696" font-size="14" class="label" text-anchor="start">DETECTS OUT OF THE BOX</text>
<rect x="48" y="714" width="71.68" height="32" rx="16" style="fill: var(--surface); stroke: var(--border)"/>
<text x="83.84" y="735" font-size="14" text-anchor="middle">nudity</text>
<rect x="129.68" y="714" width="137.2" height="32" rx="16" style="fill: var(--surface); stroke: var(--border)"/>
<text x="198.28" y="735" font-size="14" text-anchor="middle">sexual activity</text>
<rect x="276.88" y="714" width="100.8" height="32" rx="16" style="fill: var(--surface); stroke: var(--border)"/>
<text x="327.28" y="735" font-size="14" text-anchor="middle">suggestive</text>
<rect x="387.68" y="714" width="86.24000000000001" height="32" rx="16" style="fill: var(--surface); stroke: var(--border)"/>
<text x="430.8" y="735" font-size="14" text-anchor="middle">violence</text>
<rect x="483.92" y="714" width="57.120000000000005" height="32" rx="16" style="fill: var(--surface); stroke: var(--border)"/>
<text x="512.48" y="735" font-size="14" text-anchor="middle">gore</text>
<rect x="551.04" y="714" width="78.96000000000001" height="32" rx="16" style="fill: var(--surface); stroke: var(--border)"/>
<text x="590.52" y="735" font-size="14" text-anchor="middle">weapons</text>
<rect x="640.0" y="714" width="115.36" height="32" rx="16" style="fill: var(--surface); stroke: var(--border)"/>
<text x="697.68" y="735" font-size="14" text-anchor="middle">hate symbols</text>
<rect x="765.36" y="714" width="64.4" height="32" rx="16" style="fill: var(--surface); stroke: var(--border)"/>
<text x="797.5600000000001" y="735" font-size="14" text-anchor="middle">drugs</text>
<rect x="839.76" y="714" width="93.52" height="32" rx="16" style="fill: var(--surface); stroke: var(--border)"/>
<text x="886.52" y="735" font-size="14" text-anchor="middle">self-harm</text>
<rect x="943.28" y="714" width="78.96000000000001" height="32" rx="16" style="fill: var(--surface); stroke: var(--border)"/>
<text x="982.76" y="735" font-size="14" text-anchor="middle">alcohol</text>
<rect x="1032.24" y="714" width="78.96000000000001" height="32" rx="16" style="fill: var(--surface); stroke: var(--border)"/>
<text x="1071.72" y="735" font-size="14" text-anchor="middle">tobacco</text>
<rect x="48" y="758" width="180.88" height="32" rx="16" style="fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: 4 3"/>
<text x="138.44" y="779" font-size="14" class="accent" text-anchor="middle">+ your own categories</text>
<text x="48" y="846" font-size="14" class="label" text-anchor="start">ROADMAP</text>
<line x1="108.0" y1="886" x2="1092.0" y2="886" style="stroke: var(--border); stroke-width: 3"/>
<line x1="108.0" y1="886" x2="1092.0" y2="886" style="stroke: var(--accent); stroke-width: 3"/>
<circle cx="108.0" cy="886" r="9" style="fill: var(--accent); stroke: var(--accent)"/>
<path d="M104.0,886 l3,3 l5,-6" style="stroke: var(--bg); stroke-width: 2; fill: none"/>
<text x="108.0" y="918" font-size="15" font-weight="650" text-anchor="middle">v0.1</text>
<text x="108.0" y="938" font-size="13" class="muted" text-anchor="middle">Core engine</text>
<circle cx="304.8" cy="886" r="9" style="fill: var(--accent); stroke: var(--accent)"/>
<path d="M300.8,886 l3,3 l5,-6" style="stroke: var(--bg); stroke-width: 2; fill: none"/>
<text x="304.8" y="918" font-size="15" font-weight="650" text-anchor="middle">v0.2</text>
<text x="304.8" y="938" font-size="13" class="muted" text-anchor="middle">CLI + training</text>
<circle cx="501.6" cy="886" r="9" style="fill: var(--accent); stroke: var(--accent)"/>
<path d="M497.6,886 l3,3 l5,-6" style="stroke: var(--bg); stroke-width: 2; fill: none"/>
<text x="501.6" y="918" font-size="15" font-weight="650" text-anchor="middle">v0.3</text>
<text x="501.6" y="938" font-size="13" class="muted" text-anchor="middle">REST API + Docker</text>
<circle cx="698.4000000000001" cy="886" r="9" style="fill: var(--accent); stroke: var(--accent)"/>
<path d="M694.4000000000001,886 l3,3 l5,-6" style="stroke: var(--bg); stroke-width: 2; fill: none"/>
<text x="698.4000000000001" y="918" font-size="15" font-weight="650" text-anchor="middle">v0.4</text>
<text x="698.4000000000001" y="938" font-size="13" class="muted" text-anchor="middle">Framework middleware</text>
<circle cx="895.2" cy="886" r="9" style="fill: var(--accent); stroke: var(--accent)"/>
<path d="M891.2,886 l3,3 l5,-6" style="stroke: var(--bg); stroke-width: 2; fill: none"/>
<text x="895.2" y="918" font-size="15" font-weight="650" text-anchor="middle">v0.5</text>
<text x="895.2" y="938" font-size="13" class="muted" text-anchor="middle">Video</text>
<circle cx="1092.0" cy="886" r="9" style="fill: var(--accent); stroke: var(--accent)"/>
<path d="M1088.0,886 l3,3 l5,-6" style="stroke: var(--bg); stroke-width: 2; fill: none"/>
<text x="1092.0" y="918" font-size="15" font-weight="650" text-anchor="middle">v1.0</text>
<text x="1092.0" y="938" font-size="13" class="muted" text-anchor="middle">Stable release</text>
<text x="48" y="982" font-size="13" class="muted" text-anchor="start">Apache-2.0  ·  github.com/karammm/openmoderate-image-moderation</text>
</svg>